    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta
          http-equiv="Content-Security-Policy"
          content="
      default-src 'self';
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self';
      connect-src 'self' http://localhost:8080 https://beepsafe-1-0-0-back.onrender.com https://beepsafe-10-0-back-production.up.railway.app;
      object-src 'none';
    "
        />

        <title>Iniciar/Detener Actividad</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../styles/styles.css">
    </head>
    <body>
        <div class="logout">
            <span id="cerrarSesionBtn" class="logoutbutton">Cerrar Sesión</span>
        </div>
        <div class="contenedor">
            <div class = "caja1">
                <p class="saludo">¡Hola </p>
                <p id="nombre" class="saludo"><strong></strong></p>
            </div>
            <div class = "caja2">
                <img class="logoActividad" id="iconoActividad" src="../imagenes/IlustracionWindsurf.png" alt="Imagen de actividad">
            </div>
        </div>
        <div class="reloj">
            <svg class="anilloReloj" viewBox="0 0 310 310" aria-hidden="true">
                <circle class="anilloBase" cx="155" cy="155" r="145" fill="none" stroke-width="20"></circle>
                <circle id="anilloProgreso" class="anilloProgreso" cx="155" cy="155" r="145" fill="none" stroke-width="20"></circle>
            </svg>
            <button class="botonIniciar" id="botonIniciar" type="button"><span id="etiquetaBoton">INICIAR</span><br><span class="tiempo">03:00:00</span></button>
        </div>


        <div class="contenedor-padre">
            <div class="flex-container">
                <div class="item1">
                <div class="desplegable">
                    <button type="button" class="triggerDesplegable" id="triggerActividad" aria-haspopup="true" aria-expanded="false">Actividad</button>
                    <button type="button" class="filaValor" id="filaValorActividad" tabindex="-1">Sin actividad</button>
                    <div class="panelDesplegable" id="panelActividad">
                    <ul class="listaDesplegable" id="listaActividad"></ul>
                    </div>
                </div>
                </div>
                <div class="item2">
                <div class="desplegable">
                    <button type="button" class="triggerDesplegable" id="triggerEquipo1" aria-haspopup="true" aria-expanded="false">Equipo 1</button>
                    <button type="button" class="filaValor" id="filaValorEquipo1" tabindex="-1">Sin equipo</button>
                    <div class="panelDesplegable" id="panelEquipo1">
                    <ul class="listaDesplegable" id="listaEquipo1"></ul>
                    </div>
                </div>
                </div>
                <div class="item3">
                <div class="desplegable">
                    <button type="button" class="triggerDesplegable" id="triggerEquipo2" aria-haspopup="true" aria-expanded="false">Equipo 2</button>
                    <button type="button" class="filaValor" id="filaValorEquipo2" tabindex="-1">Ninguno</button>
                    <div class="panelDesplegable" id="panelEquipo2">
                    <ul class="listaDesplegable" id="listaEquipo2"></ul>
                    </div>
                </div>
                </div>
                <div class="item4">
                <div class="desplegable">
                    <button type="button" class="triggerDesplegable" id="triggerTiempo" aria-haspopup="true" aria-expanded="false">Tiempo</button>
                    <button type="button" class="filaValor" id="filaValorTiempo" tabindex="-1">3h</button>
                    <div class="panelDesplegable panelTiempo" id="panelTiempo">
                    <div class="filaTiempo">
                        <span class="etiquetaFilaTiempo">Días</span>
                        <div class="stepperTiempo">
                        <button type="button" class="botonStepper" id="btnDiasMas" aria-label="Más días">▲</button>
                        <span class="valorStepper" id="valorDias">0</span>
                        <button type="button" class="botonStepper" id="btnDiasMenos" aria-label="Menos días">▼</button>
                        </div>
                    </div>
                    <div class="filaTiempo">
                        <span class="etiquetaFilaTiempo">Horas</span>
                        <div class="stepperTiempo">
                        <button type="button" class="botonStepper" id="btnHorasMas" aria-label="Más horas">▲</button>
                        <span class="valorStepper" id="valorHoras">3</span>
                        <button type="button" class="botonStepper" id="btnHorasMenos" aria-label="Menos horas">▼</button>
                        </div>
                    </div>
                    <div class="filaTiempo">
                        <span class="etiquetaFilaTiempo">Minutos</span>
                        <div class="stepperTiempo">
                        <button type="button" class="botonStepper" id="btnMinutosMas" aria-label="Más minutos">▲</button>
                        <span class="valorStepper" id="valorMinutos">0</span>
                        <button type="button" class="botonStepper" id="btnMinutosMenos" aria-label="Menos minutos">▼</button>
                        </div>
                    </div>
                    </div>
                </div>
                </div>
            </div>
        </div>

        
        <div class="contenedor-padre2">
            <div class="flex-container2">
                <div class="inicio">
                    <img class="imagenHome" src="../imagenes/homeFondoVerde.jpg" alt="Home">
                    <a href="../pages/iniciarDetener.html" class="botonInicio">Inicio</a>
                </div>
                <a href="../pages/perfil.html" class="enlaceDiv">
                    <div class="miPerfil">
                        <img class="imagenPerfil" src="../imagenes/perfilFondoBlanco.png" alt="Perfil">
                        <span  class="botonPerfil">Mi Perfil</span>
                    </div>
                </a>
            </div>
        </div>
    <script src="../JS/config.js"></script>
    <script src="../JS/cerrarSesion.js"></script>
    <script src="../JS/iniciarDetener.js"></script>


        
    </body>
    </html>
