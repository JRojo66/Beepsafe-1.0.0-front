    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div class="configuracion">
        <a href="../pages/perfil.html" class="perfil">

                <img src="../imagenes/volver.PNG" alt="Volver">

            <a href="../pages/perfil.html" class="enlaceDiv">

                    <span class="botonPerfil">Mi Perfil</span>
                </div>
