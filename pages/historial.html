<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self' https://res.cloudinary.com;
      connect-src 'self' http://localhost:8080 https://beepsafe-1-0-0-back.onrender.com https://beepsafe-10-0-back-production.up.railway.app;
      object-src 'none';
    "
    />

    <title>Mi Historial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <div class="configuracion historial-pagina">
        <div class="historial-cabecera-sticky">
            <a href="../pages/perfil.html" class="perfil">
                <div class="containerPerfil">
                    <img src="../imagenes/volver.PNG" alt="Volver">
                    <img src="../imagenes/historial.PNG" alt="Mi Historial" class="encabezado">
                    <div class="opciones">Mi Historial</div>
                </div>
            </a>
            <p class="encabezadoBajada">Acá vas a encontrar el registro de la información de las actividades que realizaste, para que puedas revisar todos los detalles.</p>
            <div class="break"></div>

            <label class="historial-toggle">
                <input type="checkbox" id="toggleEliminadas">
                <span>Ver eliminadas</span>
            </label>
        </div>

        <p id="estadoHistorial" class="msj-estado mensajes-estado" role="status" aria-live="polite"></p>
        <p id="estadoAccionHistorial" class="msj-estado mensajes-estado" role="status" aria-live="polite"></p>
        <button id="botonReintentarHistorial" class="btn-confirm" type="button" hidden>Reintentar</button>
        <div id="listaHistorial" class="historial-lista"></div>
    </div>

    <div id="modalEliminarActividad" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tituloModalEliminarActividad">
        <div class="modal-content modal-confirmacion">
            <button id="cerrarModalEliminarActividad" type="button" class="modal-cerrar" aria-label="Cerrar">×</button>
            <h2 id="tituloModalEliminarActividad" class="modal-titulo">¿Eliminar esta actividad?</h2>
            <div class="modal-buttons">
                <button id="cancelarEliminarActividad" type="button" class="modal-btn cancelar">Cancelar</button>
                <button id="continuarEliminarActividad" type="button" class="modal-btn confirmar">Continuar</button>
            </div>
        </div>
    </div>

    <div id="modalConfirmarEliminarActividad" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tituloModalConfirmarEliminarActividad">
        <div class="modal-content modal-confirmacion">
            <button id="cerrarModalConfirmarEliminarActividad" type="button" class="modal-cerrar" aria-label="Cerrar">×</button>
            <h2 id="tituloModalConfirmarEliminarActividad" class="modal-titulo">¿Desea continuar?</h2>
            <div class="modal-buttons">
                <button id="cancelarConfirmarEliminarActividad" type="button" class="modal-btn cancelar">Cancelar</button>
                <button id="eliminarActividad" type="button" class="modal-btn confirmar">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="../JS/config.js"></script>
    <script src="../JS/historial.js"></script>
</body>
</html>
