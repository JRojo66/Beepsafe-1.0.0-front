<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self';
      connect-src 'self' http://localhost:8080 https://beepsafe-1-0-0-back.onrender.com https://beepsafe-10-0-back-production.up.railway.app;
      object-src 'none';
    "
    />

    <title>Mensaje de alarma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body data-tipo="alarma">
    <main class="msj-pantalla">
        <header class="msj-cabecera">
            <div class="msj-cabecera-inner">
                <div class="msj-cabecera-barra">
                    <a class="msj-volver" href="../pages/misMensajes.html" aria-label="Volver a Mis Mensajes">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M15 5l-7 7 7 7"/>
                        </svg>
                    </a>
                    <span class="msj-cabecera-icono" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M18 16v-4a6 6 0 0 0-12 0v4l-2 3h16z"/>
                            <path d="M10 21a2 2 0 0 0 4 0"/>
                        </svg>
                    </span>
                </div>
                <h1 class="msj-titulo">Mensaje de alarma</h1>
                <p class="msj-bajada">Se envía a tus contactos si no finalizás la actividad en el tiempo previsto.</p>
            </div>
        </header>

        <div class="msj-contenido">
            <section class="msj-tarjeta" aria-labelledby="tituloEditor">
                <label class="msj-etiqueta" id="tituloEditor" for="mensaje">Tu mensaje</label>
                <textarea
                    class="msj-textarea"
                    id="mensaje"
                    name="mensaje"
                    rows="6"
                    maxlength="1000"
                    placeholder="Escribí el mensaje que van a recibir tus contactos."
                ></textarea>
                <div class="msj-editor-pie">
                    <span class="msj-contador" id="contadorMensaje">0/1000</span>
                    <button class="msj-boton" id="botonGrabar" type="button">Grabar Mensaje</button>
                </div>
                <p class="msj-estado mensajes-estado" id="estadoMensaje" role="status" aria-live="polite"></p>
            </section>

            <section class="msj-seccion" id="seccionContactos" aria-labelledby="tituloContactos">
                <h2 class="msj-subtitulo" id="tituloContactos">Contactos</h2>
                <p class="msj-ayuda">Quienes reciban tus mensajes van a ver cuándo iniciás o terminás una actividad.</p>
                <p class="msj-estado mensajes-estado" id="estadoContactos" role="status" aria-live="polite"></p>
                <ul class="msj-contactos mensajes-contactos" id="listaContactos"></ul>

                <form class="msj-form" id="formAgregarContacto">
                    <h3 class="msj-form-titulo">Agregar contacto</h3>
                    <div class="msj-form-campos">
                        <label class="msj-campo">
                            <span>Nombre</span>
                            <input type="text" id="contactoNombre" name="nombre" required autocomplete="name">
                        </label>
                        <label class="msj-campo">
                            <span>Teléfono</span>
                            <input type="tel" id="contactoTelefono" name="telefono" required autocomplete="tel" placeholder="+54911 1234 5678">
                        </label>
                    </div>
                    <label class="msj-check mensajes-check">
                        <input type="checkbox" id="contactoMensajes" name="mensajes" checked>
                        <span>Quiero que reciba mis mensajes</span>
                    </label>
                    <button class="msj-boton msj-boton-agregar" id="botonAgregarContacto" type="submit">Agregar</button>
                </form>
            </section>
        </div>
    </main>

    <script src="../JS/config.js"></script>
    <script src="../JS/mensajes.js"></script>
</body>
</html>
