<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self';
      connect-src 'self' http://localhost:8080 https://beepsafe-1-0-0-back.onrender.com https://beepsafe-10-0-back-production.up.railway.app;
      object-src 'none';
    "
    />

    <title>Crear Cuenta</title>
    <!-- Para el ojito de mostrar/ocultar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <img class="logo2" src="../imagenes/logo beepsafe fondo azul oscuro.png" alt="logo">
    <form id="registroForm"><!-- action="/procesar_formulario" method="post" -->
      <div class="formulario">
        <div class="campo">
          <input type="text" id="name" name="name" placeholder="Nombre">
          <div id="nameError" class="error-message"></div>
        </div>
        <div class="campo">
          <input type="email" id="email" name="email" placeholder="email">
          <div id="emailError" class="error-message"></div>
        </div>
        <div class="campo">
          <input type="text" id="phone" name="phone" placeholder="Telefono p.e. 1134567890" inputmode="numeric" required>
          <div id="phoneError" class="error-message"></div>
        </div>
        <div class="campo password-container">
          <input type="password" id="password" name="password" placeholder="Contraseña">
          <i class="fa fa-eye ojo" data-password-for="password"></i>
        </div>
          <div id="passwordError" class="error-message"></div>
        <div class="campo password-container">
          <input type="password" id="password2" name="password2" placeholder="Repetir contraseña">
          <i class="fa fa-eye ojo" data-password-for="password2"></i>
        </div>
          <div id="password2Error" class="error-message"></div>
        <button type="submit">Crear Cuenta</button>
      </div>
    </form>
    <script src="../JS/config.js"></script>
    <script src="../JS/crearCuenta.js"></script>
</body>
</html>
