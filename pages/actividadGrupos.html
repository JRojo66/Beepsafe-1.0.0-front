<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self' https://res.cloudinary.com;
      connect-src 'self' http://localhost:8080 https://beepsafe-1-0-0-back.onrender.com https://beepsafe-10-0-back-production.up.railway.app;
      object-src 'none';
    "
    />

    <title>Actividad Grupos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <div class="configuracion actividad-grupos-pagina">
        <div id="vistaListaActividadGrupos" class="actividad-grupos-vista">
            <div class="actividad-grupos-cabecera-sticky">
                <a href="../pages/perfil.html" class="perfil">
                    <div class="containerPerfil">
                        <img src="../imagenes/volver.PNG" alt="Volver" class="volver-arrow">
                        <img src="../imagenes/amigosSinFondoBlanco.png" alt="Actividad Grupos" class="encabezado">
                        <div class="opciones">Actividad Grupos</div>
                    </div>
                </a>
                <p class="encabezadoBajada">Mirá el estado de las actividades de tus grupos: alarmas vencidas, sesiones en curso y finalizadas.</p>
                <div class="break"></div>
            </div>
            <p id="estadoListaGrupos" class="msj-estado mensajes-estado" role="status" aria-live="polite"></p>
            <button id="botonReintentarGrupos" class="btn-confirm" type="button" hidden>Reintentar</button>
            <div id="listaGrupos" class="actividad-grupos-lista"></div>
        </div>

        <div id="vistaDetalleActividadGrupos" class="actividad-grupos-vista" hidden>
            <div class="actividad-grupos-detalle-sticky">
                <div class="actividad-grupos-detalle-fila">
                    <button id="volverListaGrupos" class="perfil actividad-grupos-volver" type="button" aria-label="Volver a mis grupos">
                        <img src="../imagenes/volver.PNG" alt="" class="volver-arrow">
                    </button>
                    <h2 id="tituloDetalleGrupo" class="actividad-grupos-titulo"></h2>
                    <button id="verIntegrantesGrupo" class="actividad-grupos-ver-integrantes" type="button">Ver integrantes</button>
                    <button id="toggleChatGrupo" class="actividad-grupos-toggle-chat" type="button">Ocultar chat</button>
                </div>
            </div>
            <p id="estadoDetalleActividad" class="msj-estado mensajes-estado" role="status" aria-live="polite"></p>
            <p id="estadoEliminarSesion" class="msj-estado mensajes-estado" role="status" aria-live="polite"></p>
            <button id="botonReintentarDetalle" class="btn-confirm" type="button" hidden>Reintentar</button>

            <div class="actividad-grupos-detalle-contenido">
                <label class="historial-toggle actividad-grupos-toggle-eliminadas">
                    <input type="checkbox" id="toggleEliminadosGrupo">
                    <span>Ver eliminadas</span>
                </label>

                <section id="seccionVencidos" class="grupo-actividad-seccion">
                    <h3 class="grupo-actividad-seccion-titulo">Alarmas vencidas</h3>
                    <div id="listaVencidos" class="grupo-actividad-miembros"></div>
                </section>

                <section id="seccionEnCurso" class="grupo-actividad-seccion">
                    <h3 class="grupo-actividad-seccion-titulo">En actividad</h3>
                    <div id="listaEnCurso" class="grupo-actividad-miembros"></div>
                </section>

                <section id="seccionTerminados" class="grupo-actividad-seccion">
                    <h3 class="grupo-actividad-seccion-titulo">Finalizadas</h3>
                    <div id="listaTerminados" class="grupo-actividad-miembros"></div>
                </section>
            </div>

            <form id="formMensajeGrupo" class="grupo-chat-composer" autocomplete="off">
                <input id="entradaMensajeGrupo" class="grupo-chat-entrada" type="text" placeholder="Escribí un mensaje" aria-label="Mensaje" />
                <button id="enviarMensajeGrupo" class="grupo-chat-enviar" type="submit">Enviar</button>
                <p id="errorMensajeGrupo" class="grupo-chat-error" role="status" aria-live="polite"></p>
            </form>
        </div>
    </div>

    <div id="modalEliminarSesion" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tituloModalEliminarSesion">
        <div class="modal-content modal-confirmacion">
            <button id="cerrarModalEliminarSesion" type="button" class="modal-cerrar" aria-label="Cerrar">×</button>
            <h2 id="tituloModalEliminarSesion" class="modal-titulo">¿Eliminar esta sesión?</h2>
            <div class="modal-buttons">
                <button id="cancelarEliminarSesion" type="button" class="modal-btn cancelar">Cancelar</button>
                <button id="continuarEliminarSesion" type="button" class="modal-btn confirmar">Continuar</button>
            </div>
        </div>
    </div>

    <div id="modalConfirmarEliminarSesion" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tituloModalConfirmarEliminar">
        <div class="modal-content modal-confirmacion">
            <button id="cerrarModalConfirmarEliminar" type="button" class="modal-cerrar" aria-label="Cerrar">×</button>
            <h2 id="tituloModalConfirmarEliminar" class="modal-titulo">¿Desea continuar?</h2>
            <div class="modal-buttons">
                <button id="cancelarConfirmarEliminar" type="button" class="modal-btn cancelar">Cancelar</button>
                <button id="eliminarSesion" type="button" class="modal-btn confirmar">Eliminar</button>
            </div>
        </div>
    </div>


    <div id="modalIntegrantesGrupo" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tituloModalIntegrantes">
        <div class="modal-content modal-confirmacion">
            <button id="cerrarModalIntegrantes" type="button" class="modal-cerrar" aria-label="Cerrar">×</button>
            <h2 id="tituloModalIntegrantes" class="modal-titulo">Integrantes</h2>
            <div id="listaIntegrantesGrupo" class="grupo-integrantes-lista"></div>
            <div class="modal-buttons">
                <button id="cerrarIntegrantesBoton" type="button" class="modal-btn cancelar">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="visorFotoEquipo" class="visor-foto hidden" role="dialog" aria-modal="true" aria-label="Foto del equipo">
        <button id="cerrarVisorFotoEquipo" class="visor-foto-cerrar" type="button" aria-label="Cerrar foto">×</button>
        <img id="imagenVisorFotoEquipo" class="visor-foto-imagen" src="" alt="">
    </div>

    <script src="../JS/config.js"></script>
    <script src="../JS/actividadGrupos.js"></script>
</body>
</html>
